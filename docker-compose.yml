# Stack locale per il report Contoso su Metabase OSS.
#   warehouse  -> PostgreSQL con lo star schema Contoso (dati di esempio sintetici)
#   appdb      -> PostgreSQL che ospita il database applicativo di Metabase
#   metabase   -> Metabase Open Source (versione fissata per riproducibilità)
#
# Avvio:  docker compose --env-file .env up -d
name: contoso-reporting

services:
  warehouse:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: contoso
      POSTGRES_USER: ${WAREHOUSE_ADMIN_USER:-contoso_admin}
      POSTGRES_PASSWORD: ${WAREHOUSE_ADMIN_PASSWORD:?imposta WAREHOUSE_ADMIN_PASSWORD in .env}
      METABASE_RO_PASSWORD: ${WAREHOUSE_RO_PASSWORD:?imposta WAREHOUSE_RO_PASSWORD in .env}
    volumes:
      - ./warehouse:/docker-entrypoint-initdb.d:ro
      - warehouse-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${WAREHOUSE_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d contoso"]
      interval: 5s
      retries: 20

  appdb:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${MB_APPDB_PASSWORD:?imposta MB_APPDB_PASSWORD in .env}
    volumes:
      - appdb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 5s
      retries: 20

  metabase:
    image: metabase/metabase:${METABASE_VERSION:-v0.56.6}
    depends_on:
      warehouse: { condition: service_healthy }
      appdb: { condition: service_healthy }
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: appdb
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${MB_APPDB_PASSWORD}
      MB_SITE_LOCALE: it
      MB_ANON_TRACKING_ENABLED: "false"
      JAVA_TIMEZONE: Europe/Rome
    ports:
      # Solo da questo PC (127.0.0.1): non raggiungibile da altri dispositivi in rete
      - "127.0.0.1:${METABASE_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/health || exit 1"]
      interval: 10s
      retries: 30

volumes:
  warehouse-data:
  appdb-data:
